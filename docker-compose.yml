version: '3.8'
services:
  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-deribit_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis_broker:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis_notifications:
    image: redis:7
    restart: always
    ports:
      - "6378:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  celery_notifications_worker:
    build: .
    restart: always
    depends_on:
      redis_notifications:
        condition: service_healthy
    environment:
      CELERY_BROKER_URL: redis://redis_notifications:6379/0
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app inspect ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - .:/app
    command: celery -A celery_app worker --loglevel=info

  celery_price_monitoring_worker:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis_broker:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-deribit_db}
      CELERY_BROKER_URL: redis://redis_broker:6379/0
      DERIBIT_API_URL: ${DERIBIT_API_URL}
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app inspect ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - .:/app
    command: celery -A celery_app worker --loglevel=info

  celery_beat:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis_broker:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-deribit_db}
      CELERY_BROKER_URL: redis://redis_broker:6379/0
      DERIBIT_API_URL: ${DERIBIT_API_URL}
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_app inspect ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - .:/app
    command: celery -A celery_app beat --loglevel=info

  auth_db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: casdoor_user
      POSTGRES_PASSWORD: casdoor_password
      POSTGRES_DB: casdoor_db
    ports:
      - "5433:5432"
    volumes:
      - casdoor_data:/var/lib/postgresql/data

  casdoor:
    image: casbin/casdoor-all-in-one
    restart: always
    ports:
      - "3000:8000"
    depends_on:
      - auth_db
    volumes:
      - ./app.conf:/conf/app.conf
    environment:
      - RUNMODE=dev

  app:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis_notifications:
        condition: service_healthy
      celery_price_monitoring_worker:
        condition: service_healthy
      celery_notifications_worker:
        condition: service_healthy
      casdoor:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-deribit_db}
      CELERY_BROKER_URL: redis://redis_broker:6379/0
      DERIBIT_API_URL: ${DERIBIT_API_URL}
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  casdoor_data: