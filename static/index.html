<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoWatch | Мониторинг цен</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>

<div class="main-container">
    <div class="row g-4">
        <div class="col-lg-8">
            <div class="glass-card">
                <div class="d-md-flex justify-content-between align-items-center mb-4">
                    <div class="btn-group">
                        <button type="button" class="btn btn-danger dropdown-toggle" style="border-radius: 20px; background-color: #0f70a3; border-color: #0f70a3;" data-bs-toggle="dropdown" aria-expanded="false">
                            Действие
                        </button>
                        <ul class="dropdown-menu" id="tickers_list">
                        </ul>
                    </div>
                    <div class="status-badge text-info mt-2 mt-md-0">● Live Connection</div>
                </div>

                <div class="price-val" id="price-display">$0.00</div>
                
                <div id="chart"></div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="d-flex gap-2 w-100">
                <div class="card bg-white bg-opacity-10 border-secondary mb-3 rounded-4 flex-fill">
                    <div class="card-body text-center p-3">
                        <a href="https://casdoor.ru.tuna.am/login/oauth/authorize?client_id=5ecdfe397b550d61f55e&response_type=code&redirect_uri=https://fastapi.ru.tuna.am/api/auth/telegram/callback&scope=read&state=casdoor" id="login-button" class="text-secondary text-decoration-none fw-medium">Войти в профиль</a>
                    </div>
                </div>
            </div>

            <div class="card bg-dark border-secondary rounded-4 shadow-lg text-white">
                <div class="card-body p-4">
                    
                    <h5 class="card-title mb-4 d-flex align-items-center">
                        <span class="me-2">🔔</span> Уведомления
                    </h5>

                    <div class="border border-secondary rounded-3 p-3 mb-4 bg-black bg-opacity-10">
                        <label class="form-label small text-secondary mb-2">Прислать уведомление, если цена достигнет:</label>
                        
                        <input type="text" class="form-control form-control-sm bg-dark border-secondary text-white mb-3" placeholder="0.00">
                        
                        <button class="btn btn-info btn-sm w-100 fw-bold py-2 shadow-sm text-dark">
                            Отложить уведомление
                        </button>
                    </div>

                    <div class="mt-2">
                        <p class="text-uppercase text-secondary fw-bold mb-3" style="font-size: 0.7rem; letter-spacing: 1px;">
                            Активные алерты:
                        </p>
                        
                        <div class="d-flex justify-content-between align-items-center py-2 border-bottom border-secondary border-opacity-50">
                            <span class="small">BTC > 5%</span>
                            <button type="button" class="btn-close btn-close-white scale-75" aria-label="Close" style="font-size: 0.6rem;"></button>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
<script src="/static/js/charts.js"></script>
<script src="/static/js/auth.js"></script>
</body>
</html>
