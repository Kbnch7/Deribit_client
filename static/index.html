<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deribit Price Viewer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <h1 class="text-center mb-4">Тестовое задание: клиент для криптобиржи Deribit</h1>
        
        <div class="card mb-4">
            <div class="card-header">Все цены для тикета</div>
            <div class="card-body">
                <form id="all-form">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" id="all-ticker" placeholder="Тикер (например, btc_usd)" required>
                    </div>
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" id="all-page" placeholder="Номер страницы (опционально)">
                        <input type="text" class="form-control" id="all-limit" placeholder="Количество записей в странице (опционально)">
                        <button class="btn btn-primary" type="submit">Запросить</button>
                    </div>
                </form>
                <div id="all-result" class="mt-3"></div>
            </div>
        </div>
        
        <div class="card mb-4">
            <div class="card-header">Последняя цена тикета</div>
            <div class="card-body">
                <form id="latest-form">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" id="latest-ticker" placeholder="Тикер (например, btc_usd)" required>
                        <button class="btn btn-primary" type="submit">Запросить</button>
                    </div>
                </form>
                <div id="latest-result" class="mt-3"></div>
            </div>
        </div>
        
        <div class="card mb-4">
            <div class="card-header">Получение цен тикета во временном интервале</div>
            <div class="card-body">
                <form id="by-date-form">
                    <div class="input-group mb-3">
                        <input type="text" class="form-control" id="date-ticker" placeholder="Тикер (например, btc_usd)" required>
                    </div>
                    <div class="input-group mb-3">
                        <input type="number" class="form-control" id="start-date" placeholder="Начало интервала в формате UNIX timestamp" required>
                        <input type="number" class="form-control" id="end-date" placeholder="Конец интервала в формате UNIX timestamp (опционально)">
                    </div>
                    <div class="input-group mb-3">
                        <input type="number" class="form-control" id="time-page" placeholder="Номер страницы (опционально)">
                        <input type="number" class="form-control" id="time-limit" placeholder="Количество записей в странице (опционально)">
                        <button class="btn btn-primary" type="submit">Запросить</button>
                    </div>
                </form>
                <div id="by-date-result" class="mt-3"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
