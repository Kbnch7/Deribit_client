asyncapi: 3.0.0
info:
  title: Notification Service API
  version: 1.0.0
  description: Сервис для обработки уведомлений через RabbitMQ

servers:
  dev:
    host: rabbitmq.example.com
    protocol: amqp
    description: Основной брокер сообщений

channels:
  priceNotification:
    address: "price.notification"
    messages:
      priceNotificationMessage:
        $ref: '#/components/messages/priceNotificationMessage'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: 'price.notification.exchange'
          type: 'direct'
          durable: true
  
components:
  messages:
    priceNotificationMessage:
      name: priceNotificationMessage
      title: Уведомления о цене
      contentType: application/json
      payload:
        type: object
        required:
          - telegramUsername
          - ticker
          - price
        properties:
          telegramUsername:
            type: string
          ticker:
            type: string
          price:
            type: number
            minimum: 0
          
operations:
  sendPriceNotification:
    action: send # Приложение ОТПРАВЛЯЕТ сообщение (publish)
    channel:
      $ref: '#/channels/priceNotification'
